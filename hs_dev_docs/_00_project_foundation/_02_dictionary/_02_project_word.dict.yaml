# ==============================================================================
# 项目术语与命名统一词典 (Project Term & Naming Dictionary)
# 作用：建立全局统一语言（Ubiquitous Language）与单一事实源（Single Source of Truth），
#       消除同义词重复定义、语义漂移与事件/动作/时间戳混淆（如 update vs updated vs updated_at）。
# ==============================================================================

# 1. 语法与词态矩阵规则 (Lifecycle Grammar & Part-of-Speech Matrix)
grammar_rules:
  command:
    part_of_speech: "动词原形 (Imperative Verb)"
    convention: "snake_case 或 camelCase"
    example: "update_order / cancel_payment"
    description: "表示发起一个动作或指令（请求尚未发生，可能被拒绝）"
  domain_event:
    part_of_speech: "名词.过去分词 (Past Participle) 或 PascalCase"
    convention: "<entity>.<action_past_tense> (如 order.updated / user.created)"
    example: "order.updated / payment.succeeded / OrderUpdated"
    description: "表示领域内已经发生的事实（只读广播，严禁用动词原形如 order.update，严禁用时间戳如 updated_at）"
  property_timestamp:
    part_of_speech: "名词或过去分词 + _at"
    convention: "<action_past_tense>_at"
    example: "created_at / updated_at / deleted_at"
    description: "实体的时间戳属性，严禁用作动作名或事件名"
  payload_action:
    part_of_speech: "全大写动名词或动词 (Upper Snake Case)"
    convention: "CREATE / UPDATE / DELETE"
    example: "action: 'UPDATE'"
    description: "变更日志、CDC 或 Webhook Payload 内部的操作类型枚举"

# 2. 内置生命周期标准词汇 (Standard Lifecycle Built-in Terms)
lifecycle_terms:
  - concept: "创建 / 登记"
    command: "create"
    event: "created"
    timestamp: "created_at"
    payload_action: "CREATE"
    forbidden_alias: ["make", "add_new", "build_entity"]

  - concept: "更新 / 修改"
    command: "update"
    event: "updated"
    timestamp: "updated_at"
    payload_action: "UPDATE"
    forbidden_alias: ["modify", "change", "alter", "renew", "on_update"]

  - concept: "删除 / 注销"
    command: "delete"
    event: "deleted"
    timestamp: "deleted_at"
    payload_action: "DELETE"
    forbidden_alias: ["remove", "destroy", "drop_entity"]

  - concept: "发布 / 生效"
    command: "publish"
    event: "published"
    timestamp: "published_at"
    payload_action: "PUBLISH"
    forbidden_alias: ["release", "send_out"]

# 3. 业务领域实体词典（重建基线 v0.2.0：与 core 契约层同源，2026-10-24 按启动令回填）
terms:
  - term: "会话"
    en_name: "session"
    abbr: "sess"
    scope: "domain_model"
    desc: "一次连续工作上下文容器：事件流 + cwd/shell/host + 声明的环境变量 + 对话轨（Q46）"
    forbidden_alias: ["workspace", "context_bag"]

  - term: "会话事件"
    en_name: "session_event"
    abbr: "evt"
    scope: "domain_model"
    desc: "会话内按序追加记录：command/proposal/ai_message/note/diagnosis/separator/env_var 七类"
    forbidden_alias: ["log_entry", "history_item"]

  - term: "任务段分隔"
    en_name: "separator"
    abbr: "-"
    scope: "interaction"
    desc: "整行 `---`：AI 上下文窗口不跨越最近分界（Q26）；历史完整保留可检索"
    forbidden_alias: ["task_break", "section_marker"]

  - term: "提案"
    en_name: "proposal"
    abbr: "prop"
    scope: "domain_model"
    desc: "意图生成的多候选结构化命令建议（candidates JSON + active 位），状态 proposed→confirmed→executed/rejected/cancelled"
    forbidden_alias: ["suggestion", "candidate_set"]

  - term: "候选"
    en_name: "candidate"
    abbr: "cand"
    scope: "domain_model"
    desc: "提案内单个命令方案：command/argv/summary/risk/conventional/逐参数解释（Q17）"
    forbidden_alias: ["option", "variant"]

  - term: "执行记录"
    en_name: "execution_record"
    abbr: "exec"
    scope: "domain_model"
    desc: "一次命令执行全量留痕：含 stdout_full/stderr_full 全量输出入库（Q45）"
    forbidden_alias: ["exec_log", "run_record"]

  - term: "审计条目"
    en_name: "audit_entry"
    abbr: "audit"
    scope: "domain_model"
    desc: "追加式审计：执行类 execute/reject + 非执行类 config_change/recipe_*/history_*/rollback_*（Q45）"
    forbidden_alias: ["audit_log_entry", "operation_log"]

  - term: "方案"
    en_name: "recipe"
    abbr: "rcp"
    scope: "domain_model"
    desc: "用户显式收藏的命令/脚本资产（kind=command|script；script 全局唯一命名，AC-38）"
    forbidden_alias: ["snippet", "favorite", "collection_item"]

  - term: "效果日志"
    en_name: "effect_entry"
    abbr: "effect"
    scope: "domain_model"
    desc: "回滚域单条效果：op=created|modified|deleted|renamed + 前后像引用（AC-29，域 15 效果日志机制）"
    forbidden_alias: ["change_log", "journal_item"]

  - term: "风险等级"
    en_name: "risk_level"
    abbr: "risk"
    scope: "domain_model"
    desc: "四级 safe/caution/dangerous/destructive；静态规则库为主、AI 自评为辅、冲突取更高（Q34）"
    forbidden_alias: ["danger_level", "severity"]

  - term: "闸门动作"
    en_name: "gate_action"
    abbr: "gate"
    scope: "domain_model"
    desc: "闸门矩阵输出：pass/weak_warning/require_double_enter/require_confirm_word/reject_agent_unconfirmed（Q35~Q37）"
    forbidden_alias: ["confirm_mode", "risk_action"]

  - term: "内置命令"
    en_name: "builtin"
    abbr: "ia-"
    scope: "interaction"
    desc: "`ia-` 命名空间系统管理命令（Q28）：行首识别、与外部命令同一分流、未知报 IAC-1501 列全表"
    forbidden_alias: ["slash_command", "meta_command"]

  - term: "混合识别"
    en_name: "hybrid_classify"
    abbr: "classify"
    scope: "interaction"
    desc: "主输入行分流（Q15）：自然语言自动走 AI、命令形态直执、?? 强制 AI、\\ 强制字面"
    forbidden_alias: ["input_routing", "smart_parse"]

  - term: "发起方"
    en_name: "actor"
    abbr: "actor"
    scope: "domain_model"
    desc: "执行发起者：human / agent:<client> / system（审计同构 tag，AC-08）"
    forbidden_alias: ["origin", "caller", "principal"]

  - term: "命令来源"
    en_name: "command_origin"
    abbr: "origin"
    scope: "domain_model"
    desc: "闸门矩阵列维度：direct=人类直输 / translated=翻译与 Agent 视同 / proposal=AI 提案"
    forbidden_alias: ["source_type", "input_kind"]
